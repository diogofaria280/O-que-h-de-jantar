<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O Que Há Para Jantar?</title>
  <meta name="description" content="Receitas à portuguesa com o que tens em casa ou com a lista certa para levar do supermercado.">
  <meta name="theme-color" content="#d9482b">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jantar?">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
/* O Que Há Para Jantar? — estilos
 * Paleta inspirada em comida: tomate, açafrão, azeitona e creme.
 */
:root {
  --tomate: #d9482b;
  --tomate-esc: #b53a20;
  --tomate-claro: #fde8e2;
  --acafrao: #f4a93a;
  --acafrao-claro: #fff1d6;
  --oliva: #5f7a3b;
  --oliva-claro: #e7efd9;
  --creme: #fff6ea;
  --papel: #fffdf9;
  --cacau: #2e1f17;
  --cacau-2: #6b5648;
  --linha: #eadfcf;
  --sombra: 0 6px 24px rgba(70, 40, 20, 0.10);
  --sombra-peq: 0 2px 10px rgba(70, 40, 20, 0.08);
  --raio: 20px;
  --raio-peq: 14px;
  --altura-nav: 68px;
  --fonte-titulo: "Fraunces", Georgia, "Times New Roman", serif;
  --fonte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-size: 16px;
  font-family: var(--fonte);
  color: var(--cacau);
  background: var(--creme);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.15; margin: 0; }
p { margin: 0; }
a { color: var(--tomate-esc); }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
:focus-visible { outline: 3px solid var(--acafrao); outline-offset: 2px; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estrutura ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255, 246, 234, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linha); }
.topo-int { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.marca { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--cacau); font-family: var(--fonte-titulo); font-weight: 700; font-size: 1.15rem; }
.marca-ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--tomate); font-size: 1.2rem; box-shadow: var(--sombra-peq); }
.marca-grande { font-size: 1.35rem; }
.marca-grande .marca-ico { width: 46px; height: 46px; font-size: 1.5rem; }
.avatar { margin-left: auto; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--acafrao); color: var(--cacau); font-weight: 700; text-decoration: none; }
.avatar.grande { width: 64px; height: 64px; font-size: 1.6rem; margin: 0; }
.nav-desk { display: none; margin-left: auto; gap: 4px; }
.nav-desk a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; text-decoration: none; color: var(--cacau-2); font-weight: 600; font-size: 0.95rem; position: relative; }
.nav-desk a:hover { background: var(--acafrao-claro); }
.nav-desk a.ativo { background: var(--tomate); color: #fff; }
.contador { background: var(--acafrao); color: var(--cacau); font-size: 0.7rem; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding: 0 5px; }

.nav-baixo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: var(--altura-nav); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--papel); border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 20px rgba(70, 40, 20, 0.06); }
.nav-baixo a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--cacau-2); font-size: 0.7rem; font-weight: 600; position: relative; }
.nav-baixo a .ico { font-size: 1.35rem; line-height: 1; }
.nav-baixo a.ativo { color: var(--tomate); }
.nav-baixo .contador { position: absolute; top: 6px; left: calc(50% + 6px); }

.conteudo { max-width: 1120px; margin: 0 auto; padding: 20px 16px calc(var(--altura-nav) + 32px); outline: none; }
.conteudo.com-barra { padding-bottom: calc(var(--altura-nav) + 100px); }
main:focus { outline: none; }
.pagina-estreita { max-width: 640px; margin: 0 auto; }
.centrado { text-align: center; justify-content: center; margin-left: auto; margin-right: auto; }

@media (min-width: 860px) {
  .nav-desk { display: flex; }
  .nav-baixo { display: none; }
  .avatar { margin-left: 8px; }
  .conteudo { padding: 32px 24px 64px; }
  .conteudo.com-barra { padding-bottom: 120px; }
}

/* ---------- Tipografia e botões ---------- */
.titulo-pagina { font-size: clamp(1.6rem, 4vw, 2.2rem); }
.titulo-grande { font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -0.02em; }
.sub { color: var(--cacau-2); margin-top: 6px; }
.sub-peq { color: var(--cacau-2); font-size: 0.85rem; display: block; }
.nota { color: var(--cacau-2); font-size: 0.82rem; margin: 10px 0; }
.ligacao { font-weight: 600; font-size: 0.9rem; }
.sec-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
.sec-titulo { font-size: 1.3rem; }
.cab-pagina { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.btn-voltar { display: inline-grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--papel); border: 1px solid var(--linha); text-decoration: none; color: var(--cacau); font-size: 1.1rem; box-shadow: var(--sombra-peq); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 999px; border: 2px solid transparent; font-weight: 700; text-decoration: none; transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease; }
.btn:not(:disabled):hover { transform: translateY(-1px); }
.btn:not(:disabled):active { transform: translateY(0); }
.btn-primario { background: var(--tomate); color: #fff; box-shadow: 0 6px 16px rgba(217, 72, 43, 0.3); }
.btn-primario:not(:disabled):hover { background: var(--tomate-esc); }
.btn-sec { background: var(--papel); color: var(--cacau); border-color: var(--linha); }
.btn-sec:not(:disabled):hover { border-color: var(--acafrao); background: var(--acafrao-claro); }
.btn-fantasma { background: transparent; color: var(--cacau-2); }
.btn-fantasma:not(:disabled):hover { background: rgba(0, 0, 0, 0.05); }
.btn-grande { padding: 15px 26px; font-size: 1.05rem; }
.btn-peq { padding: 8px 14px; font-size: 0.88rem; }
.btn-bloco { display: flex; width: 100%; }
.perigo { color: #a32a14; }
.icone-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linha); background: var(--papel); display: inline-grid; place-items: center; }

.rodape-acoes { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; }
.rodape-acoes.centrado { justify-content: center; }
.acoes-col { display: grid; gap: 10px; margin-top: 16px; }

/* ---------- Formulários ---------- */
.campo { display: grid; gap: 6px; margin-bottom: 14px; }
.campo label { font-weight: 600; font-size: 0.9rem; }
.campo input, .campo-pass input { width: 100%; padding: 13px 14px; border-radius: var(--raio-peq); border: 2px solid var(--linha); background: var(--papel); font: inherit; color: var(--cacau); }
.campo input:focus { border-color: var(--acafrao); outline: none; box-shadow: 0 0 0 4px var(--acafrao-claro); }
.campo-pass { position: relative; }
.ver-pass { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 1.1rem; padding: 6px; }
.erro-form { background: var(--tomate-claro); color: var(--tomate-esc); padding: 10px 14px; border-radius: var(--raio-peq); font-size: 0.9rem; margin-bottom: 14px; }
.separador { display: flex; align-items: center; gap: 12px; color: var(--cacau-2); font-size: 0.85rem; margin: 18px 0; }
.separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: var(--linha); }

/* ---------- Início de sessão ---------- */
.entrar { min-height: 100vh; display: grid; }
.entrar-hero { display: none; }
.entrar-cartao { padding: 32px 22px 40px; max-width: 460px; width: 100%; margin: 0 auto; align-self: center; }
.entrar-cartao .marca { margin-bottom: 22px; }
.entrar-titulo { font-size: 2rem; }
.abas { display: grid; grid-template-columns: 1fr 1fr; background: #f3e8d6; border-radius: 999px; padding: 4px; margin: 20px 0; }
.aba { border: 0; background: transparent; border-radius: 999px; padding: 10px; font-weight: 700; color: var(--cacau-2); }
.aba.ativo { background: var(--papel); color: var(--cacau); box-shadow: var(--sombra-peq); }
@media (min-width: 900px) {
  .entrar { grid-template-columns: 1.1fr 1fr; }
  .entrar-hero { display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 60px; color: #fff; background:
    radial-gradient(circle at 20% 15%, rgba(244, 169, 58, 0.55), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(95, 122, 59, 0.55), transparent 50%),
    linear-gradient(145deg, #d9482b, #a8321b); }
  .entrar-hero h2 { font-size: 2.8rem; letter-spacing: -0.02em; }
  .entrar-hero p { font-size: 1.1rem; opacity: 0.92; max-width: 30ch; }
  .hero-pratos { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; margin-bottom: 10px; }
  .hero-pratos span { display: grid; place-items: center; height: 76px; border-radius: 24px; background: rgba(255, 255, 255, 0.18); font-size: 2.4rem; }
  .hero-pratos span:nth-child(even) { transform: translateY(14px); }
}

/* ---------- Supermercados ---------- */
.loja-selo { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; font-weight: 800; font-family: var(--fonte-titulo); font-size: 1.2rem; flex: none; }
.loja-selo.grande { width: 56px; height: 56px; border-radius: 16px; font-size: 1.7rem; }
.loja-selo.enorme { width: 76px; height: 76px; border-radius: 22px; font-size: 2.3rem; margin-bottom: 10px; }
.grelha-lojas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 26px 0 8px; }
@media (min-width: 560px) { .grelha-lojas { grid-template-columns: repeat(4, 1fr); } .pagina-estreita:has(.grelha-lojas) { max-width: 760px; } }
.loja-cartao { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px; background: var(--papel); border: 2px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra-peq); transition: transform 0.12s ease, border-color 0.12s ease; }
.loja-cartao:hover { transform: translateY(-2px); }
.loja-cartao.sel { border-color: var(--oliva); background: var(--oliva-claro); }
.loja-nome { font-weight: 700; font-size: 0.95rem; text-align: center; }
.tique { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--linha); display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; color: #fff; background: transparent; }
.sel .tique, .opcao.ativo .tique { background: var(--oliva); border-color: var(--oliva); }

/* ---------- Início ---------- */
.boas-vindas { margin: 6px 0 4px; }
.saudacao { color: var(--cacau-2); font-weight: 600; margin-bottom: 4px; }
.carrossel { position: relative; margin: 0 -16px; }
.faixa { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 14px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.faixa::-webkit-scrollbar { display: none; }
.loja-mini { flex: none; width: 150px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra-peq); scroll-snap-align: start; text-align: left; }
.loja-mini .loja-nome { text-align: left; margin-top: 4px; }
.loja-dist { color: var(--cacau-2); font-size: 0.82rem; }
.carr-controlos { display: none; gap: 6px; }
.carr-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--linha); background: var(--papel); font-size: 1.3rem; line-height: 1; }
@media (min-width: 860px) { .carr-controlos { display: flex; } .carrossel { margin: 0; } .faixa { padding-left: 2px; } .loja-mini { width: 180px; } }

.acoes-principais { display: grid; gap: 14px; margin: 18px 0 8px; }
@media (min-width: 700px) { .acoes-principais { grid-template-columns: 1fr 1fr; } }
.acao-cartao { display: flex; align-items: center; gap: 16px; padding: 22px; border-radius: 26px; text-decoration: none; color: #fff; box-shadow: var(--sombra); transition: transform 0.15s ease; }
.acao-cartao:hover { transform: translateY(-3px); }
.acao-casa { background: linear-gradient(135deg, #d9482b, #ef7a3c); }
.acao-compras { background: linear-gradient(135deg, #5f7a3b, #86a04f); }
.acao-emoji { font-size: 2.6rem; width: 64px; height: 64px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.2); border-radius: 20px; flex: none; }
.acao-texto { display: grid; gap: 2px; flex: 1; }
.acao-texto strong { font-family: var(--fonte-titulo); font-size: 1.35rem; }
.acao-texto span { font-size: 0.92rem; opacity: 0.95; }
.seta { font-size: 1.6rem; }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 2px solid var(--linha); background: var(--papel); font-weight: 600; font-size: 0.92rem; transition: all 0.12s ease; }
.chip:hover { border-color: var(--acafrao); }
.chip.ativo { background: var(--tomate); border-color: var(--tomate); color: #fff; }
.chip.pequeno { padding: 5px 11px; font-size: 0.8rem; background: var(--acafrao-claro); border-color: transparent; cursor: default; }
.resumo-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.bloco-titulo { font-family: var(--fonte); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cacau-2); margin: 20px 0 10px; }

/* ---------- Cozinha em Casa ---------- */
.ferramentas-casa { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.campo-busca { flex: 1; min-width: 220px; margin: 0; }
.pessoas-mini { display: grid; gap: 4px; font-size: 0.82rem; font-weight: 600; color: var(--cacau-2); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--papel); border: 2px solid var(--linha); border-radius: 999px; padding: 3px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--acafrao-claro); font-size: 1.1rem; font-weight: 700; }
.stepper button:hover { background: var(--acafrao); }
.stepper output { min-width: 28px; text-align: center; font-weight: 700; padding: 0 6px; white-space: nowrap; }
.stepper.peq button { width: 28px; height: 28px; }
.atalhos { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
.barra-fixa { position: fixed; left: 0; right: 0; bottom: var(--altura-nav); z-index: 25; padding: 10px 16px; background: linear-gradient(to top, var(--creme) 70%, transparent); }
.barra-int { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--papel); border: 1px solid var(--linha); border-radius: 999px; padding: 8px 8px 8px 22px; box-shadow: var(--sombra); }
.barra-info { font-weight: 600; font-size: 0.95rem; }
@media (min-width: 860px) { .barra-fixa { bottom: 0; } }

/* ---------- Receitas (cartões) ---------- */
.grelha-receitas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .grelha-receitas { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
@media (min-width: 960px) { .grelha-receitas { grid-template-columns: repeat(5, 1fr); } }
.cartao-receita { display: flex; flex-direction: column; background: var(--papel); border-radius: var(--raio); overflow: hidden; text-decoration: none; color: inherit; box-shadow: var(--sombra-peq); border: 1px solid var(--linha); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.cartao-receita:hover { transform: translateY(-3px); box-shadow: var(--sombra); }
.foto { position: relative; aspect-ratio: 4 / 3; background: linear-gradient(135deg, var(--acafrao-claro), var(--tomate-claro)); overflow: hidden; }
.foto::after { content: attr(data-emoji); position: absolute; inset: 0; display: grid; place-items: center; font-size: 3rem; }
.foto img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
.foto-grande { aspect-ratio: 16 / 9; border-radius: 0; }
.foto-grande::after { font-size: 6rem; }
.cartao-corpo { padding: 12px 12px 14px; display: grid; gap: 6px; align-content: start; flex: 1; }
.cartao-corpo h3 { font-family: var(--fonte); font-size: 0.95rem; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 0.8rem; color: var(--cacau-2); font-weight: 600; }
.selo-info { justify-self: start; display: inline-block; background: var(--acafrao-claro); color: #8a5a07; font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.selo-info.ok { background: var(--oliva-claro); color: #3f5a1f; }
.selo-info.meio { background: var(--acafrao-claro); color: #8a5a07; }
.selo-info.nada { background: var(--tomate-claro); color: var(--tomate-esc); }
.aviso { background: var(--acafrao-claro); border-left: 4px solid var(--acafrao); padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 10px; }
.cartao-lista { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; margin: 4px 0 18px; box-shadow: var(--sombra-peq); }
.vazio-texto { color: var(--cacau-2); padding: 12px 0; }

/* ---------- Questionário ---------- */
.progresso-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 600; color: var(--cacau-2); font-size: 0.9rem; }
.progresso { height: 8px; background: #f0e3cf; border-radius: 999px; overflow: hidden; margin-bottom: 26px; }
.progresso span { display: block; height: 100%; background: linear-gradient(90deg, var(--acafrao), var(--tomate)); border-radius: 999px; transition: width 0.3s ease; }
.opcoes { display: grid; gap: 10px; margin-top: 22px; }
.opcoes.duas-col { grid-template-columns: repeat(2, 1fr); }
.opcao { position: relative; display: flex; align-items: center; gap: 12px; padding: 16px; text-align: left; background: var(--papel); border: 2px solid var(--linha); border-radius: var(--raio); transition: all 0.12s ease; }
.opcao:hover { border-color: var(--acafrao); }
.opcao.ativo { border-color: var(--oliva); background: var(--oliva-claro); }
.opcao-emoji { font-size: 1.8rem; flex: none; }
.opcao-texto { display: grid; }
.opcao-texto small { color: var(--cacau-2); font-size: 0.8rem; }
.opcoes.duas-col .opcao { flex-direction: column; text-align: center; padding: 18px 10px; }
@media (min-width: 560px) { .opcoes.duas-col { grid-template-columns: repeat(3, 1fr); } }

/* ---------- Detalhe da receita ---------- */
.receita { background: var(--papel); border-radius: 28px; overflow: hidden; box-shadow: var(--sombra); border: 1px solid var(--linha); }
.receita-hero { position: relative; }
.flutuante { position: absolute; top: 14px; z-index: 2; }
.btn-voltar.flutuante { left: 14px; }
.btn-fav { right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--papel); box-shadow: var(--sombra-peq); font-size: 1.4rem; color: var(--tomate); }
.btn-fav.ativo { background: var(--tomate); color: #fff; }
.receita-corpo { padding: 22px 18px 28px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }

.receita-grelha { display: grid; gap: 8px; }

.ing-linha { display: flex; align-items: center; gap: 8px; padding: 11px 0; border-bottom: 1px dashed var(--linha); }
.ing-nome { flex: 1; font-weight: 600; }
.ing-qtd { color: var(--cacau-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ing-linha.falta .ing-nome { color: var(--tomate-esc); }
.tag { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 6px; padding: 2px 6px; }
.tag-ok { background: var(--oliva-claro); color: #3f5a1f; }
.tag-falta { background: var(--tomate-claro); color: var(--tomate-esc); }
.lista-passos { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.passo-btn { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; padding: 14px; border-radius: var(--raio-peq); border: 2px solid var(--linha); background: var(--papel); }
.passo-num { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--tomate); color: #fff; display: grid; place-items: center; font-weight: 800; }
.passo.feito .passo-btn { background: var(--oliva-claro); border-color: transparent; }
.passo.feito .passo-num { background: var(--oliva); }
.passo.feito .passo-txt { text-decoration: line-through; color: var(--cacau-2); }

.loja-escolha { margin-bottom: 8px; display: grid; gap: 8px; }

.item-lista.feito .caixa { background: var(--oliva); border-color: var(--oliva); }
.item-nome { flex: 1; display: grid; font-weight: 600; }
.item-nome small { color: var(--cacau-2); font-weight: 400; font-size: 0.78rem; }
.item-preco { font-variant-numeric: tabular-nums; font-weight: 700; }
.item-lista.feito .item-nome, .item-lista.feito .item-preco { text-decoration: line-through; color: var(--cacau-2); }
.basicos-txt { background: var(--papel); border: 1px dashed var(--linha); border-radius: var(--raio-peq); padding: 12px 14px; color: var(--cacau-2); font-size: 0.9rem; }

.vazio-emoji { font-size: 4rem; }
.vazio p { color: var(--cacau-2); }

/* ---------- Perfil ---------- */
.cartao-perfil { display: flex; align-items: center; gap: 16px; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; box-shadow: var(--sombra-peq); }
.perfil-nome { font-family: var(--fonte-titulo); font-size: 1.3rem; display: block; }
.acoes-conta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(46, 31, 23, 0.5); display: flex; align-items: flex-end; justify-content: center; }
.folha { position: relative; background: var(--papel); width: 100%; max-width: 440px; border-radius: 28px 28px 0 0; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); animation: subir 0.22s ease-out; }
.fechar { position: absolute; top: 14px; right: 14px; }
@media (min-width: 560px) { .modal { align-items: center; } .folha { border-radius: 28px; } }
@keyframes subir { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Aviso rápido ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--altura-nav) + 90px); transform: translate(-50%, 20px); background: var(--cacau); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.toast.visivel { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 860px) { .toast { bottom: 100px; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

@media print {
  .topo, .nav-baixo, .nav-desk, .barra-fixa, .rodape-acoes, .acoes-col, .btn-voltar, .btn-fav, .toast { display: none !important; }
  body { background: #fff; }
}

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--creme); }

  <script>
/* O Que Há Para Jantar? — lógica (sem interface)
 *
 * Funções puras: sugestões de receitas, escalas de quantidades, custos e lista de compras.
 * Funciona no navegador (window.OQHPJ_LOGICA) e em Node (require), para poder ser testada.
 */
(function (raiz, fabrica) {
  if (typeof module === 'object' && module.exports) module.exports = fabrica(require('./dados.js'));
  else raiz.OQHPJ_LOGICA = fabrica(raiz.OQHPJ_DADOS);
})(typeof self !== 'undefined' ? self : this, function (D) {
  'use strict';

  const ING = D.ingredientes;
  const INTEIRAS = ['un', 'dentes', 'molho', 'fatias'];
  const CATEGORIAS_PREF = ['arroz', 'massa', 'carne', 'peixe', 'fastfood'];

  /* ---------- Utilitários ---------- */
  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  function hashTexto(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // Número "aleatório" estável (0 a 1) para uma chave e uma semente.
  function aleatorio(chave, semente) {
    return (hashTexto(chave + '|' + (semente || 0)) % 10000) / 10000;
  }

  function num(n) {
    return String(Math.round(n * 10) / 10).replace('.', ',');
  }

  function eur(n) {
    return (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' €';
  }

  function receitaPorId(id) {
    return D.receitas.find(function (r) { return r.id === id; }) || null;
  }

  /* ---------- Etiquetas derivadas dos ingredientes ---------- */
  const cacheEtiquetas = new Map();

  function etiquetas(r) {
    if (cacheEtiquetas.has(r.id)) return cacheEtiquetas.get(r.id);
    const t = { vegan: true, vegetariano: true, gluten: false, lactose: false, ovos: false, peixe: false, porco: false };
    r.ing.forEach(function (par) {
      const g = ING[par[0]];
      if (!g) return;
      if (g.o === 'carne' || g.o === 'peixe') { t.vegetariano = false; t.vegan = false; }
      if (g.o === 'animal') t.vegan = false;
      if (g.o === 'peixe') t.peixe = true;
      if (g.porco) t.porco = true;
      (g.a || []).forEach(function (a) { t[a] = true; });
    });
    cacheEtiquetas.set(r.id, t);
    return t;
  }

  /* ---------- Quantidades ---------- */
  function fator(pessoas, base) {
    return (pessoas || 2) / (base || 2);
  }

  function escalar(qtd, un, f) {
    const x = qtd * f;
    if (un === 'lata') return Math.max(1, Math.ceil(x - 1e-9));
    if (INTEIRAS.indexOf(un) >= 0) return Math.max(0.5, Math.round(x * 2) / 2);
    const passo = x < 20 ? 1 : x < 100 ? 5 : 10;
    return Math.max(passo, Math.round(x / passo) * passo);
  }

  function fracao(q) {
    const inteiro = Math.floor(q);
    const meio = q - inteiro >= 0.5 ? '½' : '';
    if (!inteiro) return meio || '0';
    return inteiro + meio;
  }

  function formatarQtd(q, un) {
    switch (un) {
      case 'g': return q >= 1000 ? num(q / 1000) + ' kg' : num(q) + ' g';
      case 'ml': return q >= 1000 ? num(q / 1000) + ' l' : num(q) + ' ml';
      case 'un': return fracao(q) + ' un.';
      case 'dentes': return fracao(q) + (q > 1 ? ' dentes' : ' dente');
      case 'lata': return fracao(q) + (q > 1 ? ' latas' : ' lata');
      case 'molho': return fracao(q) + (q > 1 ? ' molhos' : ' molho');
      case 'fatias': return fracao(q) + (q > 1 ? ' fatias' : ' fatia');
      default: return num(q) + ' ' + un;
    }
  }

  // Substitui [[450|ml]] pela quantidade ajustada ao número de pessoas.
  function escalarPasso(texto, f) {

      return formatarQtd(escalar(Number(n), u, f), u);
    });
  }

  function linhasIngredientes(r, pessoas) {
    const f = fator(pessoas, r.porcoes);
    return r.ing.map(function (par) {
      const id = par[0];
      const g = ING[id];
      const basico = !!g.b;
      return {
        id: id,
        nome: g.n,
        emoji: g.e,
        basico: basico,
        qtd: basico ? 'q.b.' : formatarQtd(escalar(par[1], g.u, f), g.u)
      };
    });
  }

  /* ---------- Custos ---------- */
  // Custo proporcional das quantidades usadas (não o da embalagem inteira).
  function custo(r, pessoas, indice, excluir) {
    const f = fator(pessoas, r.porcoes);
    let total = 0;
    r.ing.forEach(function (par) {
      const g = ING[par[0]];
      if (!g || g.b) return;
      if (excluir && excluir.indexOf(par[0]) >= 0) return;
      total += (par[1] * f / g.emb) * g.p;
    });
    return total * (indice || 1);
  }

  /* ---------- Sugestões: "Cozinha em Casa" ---------- */
  function sugerirPorIngredientes(tenho, opc) {
    opc = opc || {};
    const semente = opc.semente || 0;
    const conjunto = tenho instanceof Set ? tenho : new Set(tenho);
    const itens = D.receitas.map(function (r) {
      const essenciais = r.ing.map(function (p) { return p[0]; }).filter(function (id) { return !ING[id].b; });
      const tem = essenciais.filter(function (id) { return conjunto.has(id); });
      const faltam = essenciais.filter(function (id) { return !conjunto.has(id); });
      const razao = essenciais.length ? tem.length / essenciais.length : 0;
      const pontos = razao * 10 + tem.length * 0.3 + aleatorio(r.id, semente) * 1.2 - (r.tempo > 60 ? 0.2 : 0);
      return { receita: r, tem: tem, faltam: faltam, total: essenciais.length, razao: razao, pontos: pontos };
    });
    itens.sort(function (a, b) { return b.pontos - a.pontos; });
    return itens.slice(0, opc.limite || 10);
  }

  /* ---------- Sugestões: "Vou às Compras" ---------- */
  // resp: { prefs:[], restricoes:[], pessoas, orcamento (€/pessoa ou null), tempo (min ou null) }
  function sugerirPorPreferencias(resp, opc) {
    opc = opc || {};
    const semente = opc.semente || 0;
    const indice = opc.indice || 1;
    const pessoas = resp.pessoas || 2;
    const prefs = resp.prefs || [];
    const restricoes = resp.restricoes || [];
    const avisos = [];

    const dieta = prefs.indexOf('vegan') >= 0 ? 'vegan' : prefs.indexOf('vegetariano') >= 0 ? 'vegetariano' : null;
    let cats = prefs.filter(function (p) { return CATEGORIAS_PREF.indexOf(p) >= 0; });

    if (dieta) {
      const antes = cats.length;
      cats = cats.filter(function (c) { return c !== 'carne' && c !== 'peixe'; });
      if (antes !== cats.length) {
        avisos.push('Como escolheste ' + (dieta === 'vegan' ? 'Vegan' : 'Vegetariano') + ', ignorámos Carne e Peixe.');
      }
    }
    if (restricoes.indexOf('peixe') >= 0 && cats.indexOf('peixe') >= 0) {
      cats = cats.filter(function (c) { return c !== 'peixe'; });
      avisos.push('Escolheste Peixe mas também «sem peixe», por isso ignorámos Peixe.');
    }

    const elegiveis = D.receitas.filter(function (r) {
      const t = etiquetas(r);
      if (dieta && !t[dieta]) return false;
      return !restricoes.some(function (k) { return t[k]; });
    });

    const itens = elegiveis.map(function (r) {
      const custoPP = custo(r, pessoas, indice) / pessoas;
      const casam = cats.filter(function (c) { return r.cat.indexOf(c) >= 0; }).length;
      const dentroTempo = resp.tempo == null || r.tempo <= resp.tempo;
      const dentroOrc = resp.orcamento == null || custoPP <= resp.orcamento;
      const pontos = casam * 3 + (dentroTempo ? 2 : 0) + (dentroOrc ? 2 : 0) +
        aleatorio(r.id, semente) * 1.5 - (cats.length && !casam ? 1 : 0);
      return { receita: r, custoPP: custoPP, casam: casam, dentroTempo: dentroTempo, dentroOrc: dentroOrc, pontos: pontos };
    });
    itens.sort(function (a, b) { return b.pontos - a.pontos; });
    const topo = itens.slice(0, 10);

    if (elegiveis.length < 10) {
      avisos.push('Só encontrámos ' + elegiveis.length + ' receita' + (elegiveis.length === 1 ? '' : 's') + ' compatível' + (elegiveis.length === 1 ? '' : 'is') + ' com as tuas escolhas.');
    }
    if (topo.some(function (i) { return !i.dentroOrc; })) avisos.push('Algumas receitas ficam acima do orçamento escolhido.');
    if (topo.some(function (i) { return !i.dentroTempo; })) avisos.push('Algumas receitas demoram mais do que o tempo escolhido.');

    return { itens: topo, avisos: avisos, dieta: dieta, elegiveis: elegiveis.length };
  }

  /* ---------- Lista de compras ---------- */
  // lista: [{ id, pessoas, excluir: [idsDeIngredientes] }]
  function consolidarLista(lista, indice) {
    indice = indice || 1;
    const precisa = {};
    const basicos = [];
    lista.forEach(function (item) {
      const r = receitaPorId(item.id);
      if (!r) return;
      const f = fator(item.pessoas || 2, r.porcoes);
      r.ing.forEach(function (par) {
        const id = par[0];
        const g = ING[id];

        if (g.b) {

          return;
        }

    const porCategoria = {};
    let total = 0;
    Object.keys(precisa).forEach(function (id) {
      const g = ING[id];
      const embalagens = Math.max(1, Math.ceil(precisa[id] / g.emb - 1e-9));
      const preco = Math.round(embalagens * g.p * indice * 100) / 100;
      total += preco;
      if (!porCategoria[g.c]) porCategoria[g.c] = [];
      porCategoria[g.c].push({
        id: id, nome: g.n, emoji: g.e, unidade: g.u,
        necessario: precisa[id], embalagens: embalagens, tamanhoEmbalagem: g.emb, preco: preco
      });
    });

    const grupos = D.ordemCategorias
      .filter(function (c) { return porCategoria[c]; })
      .map(function (c) {
        return {
          categoria: c,
          titulo: D.categorias[c],
          itens: porCategoria[c].sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt'); })
        };
      });

    return {
      grupos: grupos,
      basicos: basicos.map(function (id) { return { id: id, nome: ING[id].n, emoji: ING[id].e }; }),
      total: Math.round(total * 100) / 100,
      itens: Object.keys(precisa).length
    };
  }

  // Compara o total da mesma lista em vários supermercados (do mais barato ao mais caro).
  function totalPorLoja(lista, idsLojas) {
    return idsLojas
      .map(function (id) {
        const s = D.supermercados.find(function (x) { return x.id === id; });
        return s ? { id: id, nome: s.nome, total: consolidarLista(lista, s.indice).total } : null;
      })
      .filter(Boolean)
      .sort(function (a, b) { return a.total - b.total; });
  }

  function listaComoTexto(lista, indice, nomeLoja) {
    const c = consolidarLista(lista, indice);
    const linhas = ['Lista de compras — O Que Há Para Jantar?'];
    if (nomeLoja) linhas.push('Loja: ' + nomeLoja + ' (preços estimados)');
    linhas.push('');
    lista.forEach(function (item) {
      const r = receitaPorId(item.id);

    c.grupos.forEach(function (g) {
      linhas.push('');

      g.itens.forEach(function (i) {

    if (c.basicos.length) {

      linhas.push('BÁSICOS (confirma se tens): ' + c.basicos.map(function (b) { return b.nome; }).join(', '));
    }
    linhas.push('');

    return linhas.join('\n');
  }

  return {
    norm: norm, num: num, eur: eur, aleatorio: aleatorio,
    receitaPorId: receitaPorId, etiquetas: etiquetas,
    fator: fator, escalar: escalar, formatarQtd: formatarQtd, escalarPasso: escalarPasso,
    linhasIngredientes: linhasIngredientes, custo: custo,
    sugerirPorIngredientes: sugerirPorIngredientes,
    sugerirPorPreferencias: sugerirPorPreferencias,
    consolidarLista: consolidarLista, totalPorLoja: totalPorLoja, listaComoTexto: listaComoTexto

  function seloLoja(s, tamanho) {

      esc(s.nome.charAt(0)) + '</span>';
  }

  function foto(r, classe) {
    const h = Math.round(L.aleatorio(r.id, 7) * 40) + 5;
    return '<div class="foto ' + (classe || '') + '" data-emoji="' + esc(r.emoji) + '" style="background:linear-gradient(135deg,hsl(' + h + ',90%,90%),hsl(' + (h + 22) + ',85%,82%))">' +
      '<img src="' + esc(fotoSrc(r)) + '" alt="' + esc(r.nome) + '" loading="lazy" referrerpolicy="no-referrer"></div>';
  }

  function cartaoReceita(r, selo, extra) {
    return '<a class="cartao-receita" href="#receita-' + esc(r.id) + '">' +
      foto(r) +
      '<div class="cartao-corpo">' +
      (selo ? '<span class="selo-info ' + (selo.classe || '') + '">' + esc(selo.texto) + '</span>' : '') +
      '<h3>' + esc(r.nome) + '</h3>' +
      '<div class="meta"><span>⏱ ' + r.tempo + ' min</span>' + (extra ? '<span>' + esc(extra) + '</span>' : '') + '</div>' +
      '</div></a>';
  }

  function cabecalhoPagina(titulo, sub, voltar) {
    return '<div class="cab-pagina">' +
      (voltar ? '<a class="btn-voltar" href="' + voltar + '" aria-label="Voltar">←</a>' : '') +
      '<div><h1 class="titulo-pagina">' + esc(titulo) + '</h1>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + '</div></div>';
  }

  function moldura(html, ativo, opcoes) {
    opcoes = opcoes || {};
    const u = utilizador();
    const d = dados();
    const nLista = d ? d.lista.length : 0;
    const itens = [
      ['inicio', '#', '🏠', 'Início'],
      ['casa', '#casa', '🍳', 'Em casa'],
      ['compras', '#compras', '🛒', 'Compras'],
      ['lista', '#lista', '🧾', 'Lista'],
      ['perfil', '#perfil', '👤', 'Perfil']
    ];
    const links = itens.map(function (i) {
      return '<a href="' + i[1] + '" class="' + (ativo === i[0] ? 'ativo' : '') + '"' + (ativo === i[0] ? ' aria-current="page"' : '') + '>' +
        '<span class="ico">' + i[2] + '</span><span class="txt">' + i[3] + '</span>' +
        (i[0] === 'lista' && nLista ? '<span class="contador">' + nLista + '</span>' : '') + '</a>';
    }).join('');
    const inicial = esc((u && u.nome ? u.nome : '?').charAt(0).toUpperCase());
    return '<header class="topo"><div class="topo-int">' +
      '<a class="marca" href="#"><span class="marca-ico" aria-hidden="true">🍽️</span><span>O Que Há Para Jantar?</span></a>' +
      '<nav class="nav-desk" aria-label="Principal">' + links + '</nav>' +
      '<a class="avatar" href="#perfil" aria-label="O meu perfil">' + inicial + '</a>' +
      '</div></header>' +
      '<main id="principal" class="conteudo ' + (opcoes.classe || '') + '" tabindex="-1">' + html + '</main>' +
      '<nav class="nav-baixo" aria-label="Principal">' + links + '</nav>';
  }

  /* =========================================================
   * Vistas
   * ======================================================= */
  const vistas = {};

  /* ---------- Início de sessão / criar conta ---------- */
  vistas.entrar = function () {
    const criar = T.auth.modo === 'criar';
    return {
      sem: true,
      html:
        '<div class="entrar">' +
        '<section class="entrar-hero" aria-hidden="true">' +
        '<div class="hero-pratos"><span>🍝</span><span>🍅</span><span>🍗</span><span>🥗</span><span>🐟</span><span>🍕</span></div>' +
        '<h2>Nunca mais fiques sem saber o que há para jantar.</h2>' +
        '<p>Receitas à portuguesa com o que tens em casa ou com a lista certa para levar do supermercado.</p>' +
        '</section>' +
        '<section class="entrar-cartao">' +
        '<div class="marca marca-grande"><span class="marca-ico" aria-hidden="true">🍽️</span><span>O Que Há Para Jantar?</span></div>' +
        '<h1 class="entrar-titulo">' + (criar ? 'Cria a tua conta' : 'Bem-vindo de volta') + '</h1>' +
        '<p class="sub">' + (criar ? 'Demora menos de um minuto.' : 'Inicia sessão para continuares.') + '</p>' +
        '<div class="abas" role="tablist">' +
        '<button type="button" role="tab" class="aba ' + (!criar ? 'ativo' : '') + '" aria-selected="' + (!criar) + '" data-act="modoAuth" data-val="entrar">Iniciar sessão</button>' +
        '<button type="button" role="tab" class="aba ' + (criar ? 'ativo' : '') + '" aria-selected="' + criar + '" data-act="modoAuth" data-val="criar">Criar conta</button>' +
        '</div>' +
        '<form data-form="auth" novalidate>' +
        (criar ? '<div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" type="text" autocomplete="given-name" placeholder="Como te chamas?" required></div>' : '') +
        '<div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" placeholder="o.teu@email.pt" required></div>' +
        '<div class="campo"><label for="pass">Palavra-passe</label><div class="campo-pass">' +
        '<input id="pass" name="pass" type="password" autocomplete="' + (criar ? 'new-password' : 'current-password') + '" placeholder="Mínimo de 6 caracteres" required>' +
        '<button type="button" class="ver-pass" data-act="verPass" aria-label="Mostrar ou esconder a palavra-passe">👁</button></div></div>' +
        (T.auth.erro ? '<p class="erro-form" role="alert">' + esc(T.auth.erro) + '</p>' : '') +
        '<button class="btn btn-primario btn-grande btn-bloco" type="submit">' + (criar ? 'Criar conta' : 'Iniciar sessão') + '</button>' +
        '</form>' +
        '<div class="separador"><span>ou</span></div>' +
        '<button type="button" class="btn btn-sec btn-bloco" data-act="convidado">Continuar como convidado</button>' +
        '<p class="nota">Protótipo de demonstração: as contas e os dados ficam guardados só neste dispositivo.</p>' +
        '</section></div>'
    };
  };

  /* ---------- Escolha de supermercados ---------- */
  vistas.lojas = function () {
    const d = dados();
    const n = d.lojas.length;
    const todas = n === D.supermercados.length;
    const cartoes = D.supermercados.map(function (s) {
      const sel = d.lojas.indexOf(s.id) >= 0;
      return '<button type="button" class="loja-cartao ' + (sel ? 'sel' : '') + '" data-act="alternarLoja" data-id="' + s.id + '" aria-pressed="' + sel + '">' +
        seloLoja(s, 'grande') +
        '<span class="loja-nome">' + esc(s.nome) + '</span>' +
        '<span class="tique" aria-hidden="true">' + (sel ? '✓' : '') + '</span></button>';
    }).join('');
    return {
      sem: true,
      html:
        '<div class="pagina-estreita">' +
        '<div class="marca marca-grande centrado"><span class="marca-ico" aria-hidden="true">🍽️</span><span>O Que Há Para Jantar?</span></div>' +
        '<h1 class="titulo-pagina centrado">Onde costumas fazer compras?</h1>' +
        '<p class="sub centrado">Escolhe os teus supermercados preferidos. Vamos usá-los para estimar preços e mostrar as lojas perto de ti.</p>' +
        '<div class="grelha-lojas">' + cartoes + '</div>' +
        '<div class="rodape-acoes">' +
        '<button type="button" class="btn btn-fantasma" data-act="todasLojas">' + (todas ? 'Limpar seleção' : 'Selecionar todos') + '</button>' +
        '<button type="button" class="btn btn-primario btn-grande" data-act="confirmarLojas"' + (n ? '' : ' disabled') + '>' +
        (n ? 'Continuar com ' + n + ' ' + plural(n, 'supermercado', 'supermercados') : 'Escolhe pelo menos um') + '</button>' +
        '</div></div>'
    };
  };

  /* ---------- Início ---------- */
  vistas.inicio = function () {
    const u = utilizador();
    const d = dados();
    const lojas = d.lojas.map(lojaPorId).filter(Boolean).sort(function (a, b) { return a.dist - b.dist; });
    const principal = lojaPrincipal();
    const faixa = lojas.map(function (s) {
      return '<button type="button" class="loja-mini" data-act="abrirLoja" data-id="' + s.id + '">' +
        seloLoja(s, 'grande') +
        '<span class="loja-nome">' + esc(s.nome) + '</span>' +
        '<span class="loja-dist">📍 ' + L.num(s.dist) + ' km</span>' +
        (s.id === principal.id ? '<span class="selo-info">Loja principal</span>' : '') + '</button>';
    }).join('');
    const rapidas = D.receitas.filter(function (r) { return r.tempo <= 20; }).slice(0, 4);
    const favoritas = d.favoritos.map(L.receitaPorId).filter(Boolean).slice(0, 4);
    return {
      ativo: 'inicio',
      html:
        '<section class="boas-vindas"><p class="saudacao">' + saudacao() + ', ' + esc(u.nome) + ' 👋</p>' +
        '<h1 class="titulo-grande">O que há para jantar?</h1></section>' +
        '<section aria-labelledby="t-lojas">' +
        '<div class="sec-cab"><h2 class="sec-titulo" id="t-lojas">Supermercados perto de ti</h2>' +
        '<div class="carr-controlos"><button type="button" class="carr-btn" data-act="carrossel" data-dir="-1" aria-label="Anterior">‹</button>' +
        '<button type="button" class="carr-btn" data-act="carrossel" data-dir="1" aria-label="Seguinte">›</button></div></div>' +
        '<div class="carrossel"><div class="faixa">' + faixa + '</div></div>' +
        '<p class="nota">Distâncias de demonstração. <a href="#lojas">Alterar supermercados</a></p>' +
        '</section>' +
        '<section class="acoes-principais" aria-label="O que queres fazer?">' +
        '<a class="acao-cartao acao-casa" href="#casa"><span class="acao-emoji" aria-hidden="true">🍳</span>' +
        '<span class="acao-texto"><strong>Cozinha em Casa</strong><span>Diz-nos o que tens e sugerimos 10 receitas.</span></span><span class="seta" aria-hidden="true">→</span></a>' +
        '<a class="acao-cartao acao-compras" href="#compras"><span class="acao-emoji" aria-hidden="true">🛒</span>' +
        '<span class="acao-texto"><strong>Vou às Compras</strong><span>Responde a 5 perguntas e recebe receitas e lista.</span></span><span class="seta" aria-hidden="true">→</span></a>' +
        '</section>' +
        (favoritas.length ?
          '<section><div class="sec-cab"><h2 class="sec-titulo">As tuas favoritas</h2><a class="ligacao" href="#perfil">Ver todas</a></div>' +
          '<div class="grelha-receitas">' + favoritas.map(function (r) { return cartaoReceita(r); }).join('') + '</div></section>' : '') +
        '<section><div class="sec-cab"><h2 class="sec-titulo">Ideias rápidas (até 20 min)</h2></div>' +
        '<div class="grelha-receitas">' + rapidas.map(function (r) { return cartaoReceita(r); }).join('') + '</div></section>'
    };
  };

  /* ---------- Cozinha em Casa: escolha de ingredientes ---------- */
  function gradeIngredientes() {
    const q = L.norm(T.casa.busca);
    const blocos = D.ordemCategorias.filter(function (c) { return c !== 'despensa'; }).map(function (c) {
      const itens = Object.keys(D.ingredientes).filter(function (id) {
        const g = D.ingredientes[id];
        return g.c === c && !g.b && (!q || L.norm(g.n).indexOf(q) >= 0);
      });
      if (!itens.length) return '';
      return '<div class="bloco-ing"><h3 class="bloco-titulo">' + esc(D.categorias[c]) + '</h3><div class="chips">' +
        itens.map(function (id) {
          const g = D.ingredientes[id];
          const sel = T.casa.sel.has(id);
          return '<button type="button" class="chip ' + (sel ? 'ativo' : '') + '" data-act="alternarIng" data-id="' + id + '" aria-pressed="' + sel + '">' +
            '<span aria-hidden="true">' + g.e + '</span> ' + esc(g.n) + '</button>';
        }).join('') + '</div></div>';
    }).join('');
    return blocos || '<p class="vazio-texto">Nenhum ingrediente encontrado para «' + esc(T.casa.busca) + '».</p>';
  }

  vistas.casa = function () {
    const n = T.casa.sel.size;
    return {
      ativo: 'casa',
      html:
        cabecalhoPagina('Cozinha em Casa', 'O que tens disponível em casa? Seleciona os ingredientes.', '#') +
        '<div class="ferramentas-casa">' +
        '<div class="campo campo-busca"><label class="so-leitor" for="busca">Pesquisar ingrediente</label>' +
        '<input id="busca" type="search" data-input="busca" placeholder="Pesquisar ingrediente…" value="' + esc(T.casa.busca) + '" autocomplete="off"></div>' +
        '<div class="pessoas-mini"><span>Pessoas</span><div class="stepper">' +
        '<button type="button" data-act="pessoasCasa" data-d="-1" aria-label="Menos uma pessoa">−</button>' +
        '<output>' + T.casa.pessoas + '</output>' +
        '<button type="button" data-act="pessoasCasa" data-d="1" aria-label="Mais uma pessoa">+</button></div></div>' +
        '</div>' +
        '<div class="atalhos"><button type="button" class="btn btn-sec btn-peq" data-act="presetFrigorifico">✨ Usar um frigorífico típico</button>' +
        (n ? '<button type="button" class="btn btn-fantasma btn-peq" data-act="limparIng">Limpar tudo</button>' : '') + '</div>' +
        '<p class="nota">Sal, azeite, pimenta e outros básicos da despensa são considerados como já tens em casa.</p>' +
        '<div id="grade-ing">' + gradeIngredientes() + '</div>' +
        '<div class="barra-fixa"><div class="barra-int">' +
        '<span class="barra-info">' + (n ? '<strong>' + n + '</strong> ' + plural(n, 'ingrediente', 'ingredientes') : 'Escolhe pelo menos 2 ingredientes') + '</span>' +
        '<button type="button" class="btn btn-primario btn-grande" data-act="gerarCasa"' + (n >= 2 ? '' : ' disabled') + '>Gerar 10 receitas</button>' +
        '</div></div>',
      classe: 'com-barra'
    };
  };

  vistas['casa-receitas'] = function () {
    if (T.casa.sel.size < 2) return { redirecionar: '#casa' };
    if (!T.casa.resultados) T.casa.resultados = L.sugerirPorIngredientes(T.casa.sel, { semente: T.casa.semente });
    const res = T.casa.resultados;
    const semNada = res.every(function (i) { return i.tem.length === 0; });
    const nomes = Array.from(T.casa.sel).map(function (id) { return D.ingredientes[id].n; });
    const cartoes = res.map(function (i) {
      const tudo = i.faltam.length === 0;
      return cartaoReceita(i.receita, {
        texto: tudo ? '✔ Tens tudo' : 'Tens ' + i.tem.length + ' de ' + i.total,
        classe: tudo ? 'ok' : (i.tem.length ? 'meio' : 'nada')
      });
    }).join('');
    return {
      ativo: 'casa',
      html:
        cabecalhoPagina('As tuas 10 receitas', 'Com base no que tens em casa.', '#casa') +
        '<div class="resumo-chips" aria-label="Ingredientes escolhidos">' + nomes.map(function (n) { return '<span class="chip pequeno">' + esc(n) + '</span>'; }).join('') + '</div>' +
        (semNada ? '<p class="aviso">Não encontrámos receitas com estes ingredientes. Mostramos ideias para fazeres compras.</p>' : '') +
        '<div class="grelha-receitas">' + cartoes + '</div>' +
        '<div class="rodape-acoes">' +
        '<button type="button" class="btn btn-sec" data-act="outrasCasa">🔄 Outras sugestões</button>' +
        '<a class="btn btn-fantasma" href="#casa">Alterar ingredientes</a></div>'
    };
  };

  /* ---------- Vou às Compras: questionário ---------- */
  function valorSelecionado(passo) {
    return T.compras.resp[passo.id];
  }

  function opcaoAtiva(passo, op) {
    const v = valorSelecionado(passo);
    return passo.multi ? v.indexOf(op.v) >= 0 : v === op.v;
  }

  vistas.compras = function () {
    const i = T.compras.passo;
    const passo = PASSOS[i];
    const ultimo = i === PASSOS.length - 1;
    const precisa = passo.id === 'prefs' && T.compras.resp.prefs.length === 0;
    const opcoes = passo.op.map(function (op, k) {
      const ativa = opcaoAtiva(passo, op);
      return '<button type="button" class="opcao ' + (ativa ? 'ativo' : '') + '" data-act="opcao" data-k="' + k + '" aria-pressed="' + ativa + '">' +
        '<span class="opcao-emoji" aria-hidden="true">' + op.e + '</span>' +
        '<span class="opcao-texto"><strong>' + esc(op.l) + '</strong>' + (op.s ? '<small>' + esc(op.s) + '</small>' : '') + '</span>' +
        '<span class="tique" aria-hidden="true">' + (ativa ? '✓' : '') + '</span></button>';
    }).join('');
    return {
      ativo: 'compras',
      html:
        '<div class="pagina-estreita">' +
        '<div class="progresso-cab"><a class="btn-voltar" href="#" aria-label="Sair do questionário">✕</a>' +
        '<span>Passo ' + (i + 1) + ' de ' + PASSOS.length + '</span></div>' +
        '<div class="progresso" role="progressbar" aria-valuemin="1" aria-valuemax="' + PASSOS.length + '" aria-valuenow="' + (i + 1) + '"><span style="width:' + ((i + 1) / PASSOS.length * 100) + '%"></span></div>' +
        '<h1 class="titulo-pagina">' + esc(passo.titulo) + '</h1>' +
        '<p class="sub">' + esc(passo.sub) + '</p>' +
        '<div class="opcoes ' + (passo.id === 'prefs' || passo.id === 'restricoes' || passo.id === 'pessoas' ? 'duas-col' : '') + '">' + opcoes + '</div>' +
        '<div class="rodape-acoes">' +
        (i > 0 ? '<button type="button" class="btn btn-fantasma" data-act="anterior">← Anterior</button>' : '<span></span>') +
        '<button type="button" class="btn btn-primario btn-grande" data-act="seguinte"' + (precisa ? ' disabled' : '') + '>' +
        (ultimo ? 'Gerar 10 receitas' : precisa ? 'Escolhe pelo menos uma' : 'Seguinte →') + '</button></div></div>'
    };
  };

  function resumoRespostas() {
    const r = T.compras.resp;
    const nomes = function (passoId, valores) {
      const p = PASSOS.filter(function (x) { return x.id === passoId; })[0];
      return valores.map(function (v) { return p.op.filter(function (o) { return o.v === v; })[0].l; });
    };
    const chips = [].concat(
      nomes('prefs', r.prefs),
      nomes('restricoes', r.restricoes),
      [r.pessoas + ' ' + plural(r.pessoas, 'pessoa', 'pessoas')],
      nomes('orcamento', [r.orcamento]),
      nomes('tempo', [r.tempo])
    );
    return '<div class="resumo-chips">' + chips.map(function (c) { return '<span class="chip pequeno">' + esc(c) + '</span>'; }).join('') + '</div>';
  }

  vistas['compras-receitas'] = function () {
    if (!T.compras.resultados) T.compras.resultados = L.sugerirPorPreferencias(T.compras.resp, { semente: T.compras.semente, indice: indicePreco() });
    const res = T.compras.resultados;
    const pessoas = T.compras.resp.pessoas;
    const cartoes = res.itens.map(function (i) {
      return cartaoReceita(i.receita, null, '~' + L.eur(i.custoPP) + ' / pessoa');
    }).join('');
    const avisos = res.avisos.map(function (a) { return '<p class="aviso">' + esc(a) + '</p>'; }).join('');
    const d = dados();
    const todasNaLista = res.itens.length && res.itens.every(function (i) { return d.lista.some(function (x) { return x.id === i.receita.id; }); });
    const lista = res.itens.map(function (i) { return { id: i.receita.id, pessoas: pessoas, excluir: [] }; });
    const total = L.consolidarLista(lista, indicePreco()).total;
    return {
      ativo: 'compras',
      html:
        cabecalhoPagina('As tuas receitas', 'Feitas à medida das tuas respostas.', '#compras') +
        resumoRespostas() + avisos +
        (res.itens.length ?
          '<div class="cartao-lista"><div><strong>Lista de compras das ' + res.itens.length + ' receitas</strong>' +
          '<span class="sub-peq">≈ ' + L.eur(total) + ' em ' + esc(lojaPrincipal().nome) + ' (estimativa)</span></div>' +
          '<button type="button" class="btn btn-primario" data-act="adicionarTodas">' + (todasNaLista ? '✓ Já na lista' : '+ Adicionar todas à lista') + '</button></div>' : '') +
        '<div class="grelha-receitas">' + cartoes + '</div>' +
        '<div class="rodape-acoes">' +
        '<button type="button" class="btn btn-sec" data-act="outrasCompras">🔄 Outras sugestões</button>' +
        '<button type="button" class="btn btn-fantasma" data-act="refazer">Refazer questionário</button>' +
        '<a class="btn btn-primario" href="#lista">Ver lista de compras</a></div>'
    };
  };

  /* ---------- Detalhe da receita ---------- */
  vistas.receita = function (id) {
    const r = L.receitaPorId(id);
    if (!r) return { redirecionar: '#' };
    const d = dados();
    const deCasa = T.rotaAnterior === 'casa-receitas' && T.casa.sel.size > 0;
    const pessoas = T.receita.pessoas;
    const f = L.fator(pessoas, r.porcoes);
    const linhas = L.linhasIngredientes(r, pessoas);
    const essenciais = linhas.filter(function (l) { return !l.basico; });
    const tem = essenciais.filter(function (l) { return T.casa.sel.has(l.id); });
    const faltam = essenciais.filter(function (l) { return !T.casa.sel.has(l.id); });
    const favorita = d.favoritos.indexOf(r.id) >= 0;
    const naLista = d.lista.some(function (x) { return x.id === r.id; });
    const t = L.etiquetas(r);
    const etiquetasTxt = [t.vegan ? 'Vegan' : (t.vegetariano ? 'Vegetariana' : ''), t.gluten ? '' : 'Sem glúten', t.lactose ? '' : 'Sem lactose']
      .filter(Boolean);
    const custoPP = L.custo(r, pessoas, indicePreco()) / pessoas;
    const voltar = '#' + (T.rotaAnterior === 'inicio' ? '' : T.rotaAnterior);

    const htmlIng = linhas.map(function (l) {
      let marca = '';

  /* =========================================================
   * Router
   * ======================================================= */
  function rotaAtual() {
    const h = (location.hash || '').replace(/^#\/?/, '').replace(/\/+$/, '');
    return h;
  }

  function ir(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  let ultimaRota = null;

  function resolver(rota) {
    if (rota.indexOf('receita-') === 0) return { nome: 'receita', arg: rota.slice(8) };
    if (!rota) return { nome: 'inicio' };
    return { nome: rota };
  }

  function render() {
    let rota = rotaAtual();
    const u = utilizador();
    const d = dados();

    // Guardas de acesso
    if (!u) {
      if (rota !== 'entrar') { ir('#entrar'); return; }
    } else if (rota === 'entrar') {
      ir('#'); return;
    } else if (!d.lojas.length && rota !== 'lojas') {
      ir('#lojas'); return;
    }

    const res = resolver(rota);
    const fn = vistas[res.nome];
    if (!fn) { ir('#'); return; }

    // Registar de onde vimos (para o botão "voltar" e para saber se vimos de "em casa")
    if (res.nome !== 'receita') T.rotaAnterior = res.nome === 'inicio' ? 'inicio' : res.nome;
    if (res.nome === 'receita' && T.receita.id !== res.arg) {
      T.receita = {
        id: res.arg, feitos: new Set(),
        pessoas: T.rotaAnterior === 'casa-receitas' ? T.casa.pessoas : T.rotaAnterior === 'compras-receitas' ? T.compras.resp.pessoas : 2
      };
    }
    if (res.nome !== 'receita') T.receita.id = null;

    const saida = fn(res.arg);
    if (saida.redirecionar) { ir(saida.redirecionar); return; }

    const y = window.scrollY || 0;
    const html = saida.sem ? '<main id="principal" tabindex="-1">' + saida.html + '</main>' : moldura(saida.html, saida.ativo, { classe: saida.classe });
    $app.innerHTML = html + modalLoja();
    document.title = (res.nome === 'receita' && L.receitaPorId(res.arg) ? L.receitaPorId(res.arg).nome + ' · ' : '') + 'O Que Há Para Jantar?';

    if (ultimaRota !== rota) {
      window.scrollTo(0, 0);
      const p = document.getElementById('principal');
      if (p && p.focus) p.focus({ preventScroll: true });
      ultimaRota = rota;
    } else {
      window.scrollTo(0, y);
    }
  }

  /* =========================================================
   * Autenticação (demonstração: sem servidor)
   * ======================================================= */
  async function resumo(texto) {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }
    let h = 0;
    for (let i = 0; i < texto.length; i++) h = (h * 31 + texto.charCodeAt(i)) | 0;
    return 'f' + h;
  }

  async function submeterAuth(form) {
    const fd = new FormData(form);
    const nome = String(fd.get('nome') || '').trim();
    const email = String(fd.get('email') || '').trim().toLowerCase();
    const pass = String(fd.get('pass') || '');
    const criar = T.auth.modo === 'criar';
    const erro = function (m) { T.auth.erro = m; render(); };

    if (criar && nome.length < 2) return erro('Indica o teu nome.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return erro('Indica um e-mail válido.');
    if (pass.length < 6) return erro('A palavra-passe deve ter pelo menos 6 caracteres.');

    const hash = await resumo(email + '|' + pass);
    if (criar) {
      if (S.users[email]) return erro('Já existe uma conta com este e-mail.');
      S.users[email] = { nome: nome, hash: hash, dados: dadosVazios() };
    } else {
      const u = S.users[email];
      if (!u || u.hash !== hash) return erro('E-mail ou palavra-passe incorretos.');
    }
    S.sessao = email;
    T.auth = { modo: 'entrar', erro: '' };
    guardar();
    ir('#');
  }

  /* =========================================================
   * Ações (delegação de eventos)
   * ======================================================= */
  function adicionarALista(receitaId, pessoas, excluir) {
    const d = dados();
    const existente = d.lista.filter(function (x) { return x.id === receitaId; })[0];
    if (existente) {
      existente.pessoas = pessoas;
      existente.excluir = excluir;
      return false;
    }
    d.lista.push({ id: receitaId, pessoas: pessoas, excluir: excluir });
    return true;
  }

  function mudarPessoas(valor, delta) {
    return Math.min(12, Math.max(1, valor + delta));
  }

  // Segundo toque no espaço de 4 s confirma (window.confirm não existe em todos os ambientes).
  function confirmar(chave, aviso) {
    if (T.conf === chave) { T.conf = null; return true; }
    T.conf = chave;
    mostrarToast(aviso + ' Toca outra vez para confirmar.');
    clearTimeout(confirmar.t);
    confirmar.t = setTimeout(function () { T.conf = null; }, 4000);
    return false;
  }

  const acoes = {
    /* Autenticação */
    modoAuth: function (el) { T.auth.modo = el.dataset.val; T.auth.erro = ''; render(); },
    verPass: function (el) {
      const i = el.parentNode.querySelector('input');
      i.type = i.type === 'password' ? 'text' : 'password';
    },
    convidado: function () {
      const id = 'convidado@local';
      if (!S.users[id]) S.users[id] = { nome: 'Convidado', convidado: true, dados: dadosVazios() };
      S.sessao = id;
      guardar();
      ir('#');
    },
    sair: function () { S.sessao = null; T.auth = { modo: 'entrar', erro: '' }; guardar(); T.casa.sel = new Set(); T.casa.resultados = null; T.compras.resultados = null; ir('#entrar'); },
    apagarTudo: function () {
      if (!confirmar('apagar', 'Vais apagar todas as contas e dados deste dispositivo.')) return;
      try { localStorage.removeItem(CHAVE); } catch (e) { /* ignorar */ }
      S = { users: {}, sessao: null };
      T.auth = { modo: 'entrar', erro: '' };
      T.casa.sel = new Set(); T.casa.resultados = null; T.compras.resultados = null;
      ir('#entrar');
    },

    /* Supermercados */
    alternarLoja: function (el) {
      const d = dados();
      const id = el.dataset.id;
      const i = d.lojas.indexOf(id);
      if (i >= 0) d.lojas.splice(i, 1); else d.lojas.push(id);
      guardar(); render();
    },
    todasLojas: function () {
      const d = dados();
      d.lojas = d.lojas.length === D.supermercados.length ? [] : D.supermercados.map(function (s) { return s.id; });
      guardar(); render();
    },
    confirmarLojas: function () {
      const d = dados();
      if (!d.lojas.length) return;
      if (!d.principal || d.lojas.indexOf(d.principal) < 0) {
        d.principal = d.lojas.map(lojaPorId).sort(function (a, b) { return a.dist - b.dist; })[0].id;
      }
      guardar();
      ir('#');
    },
    abrirLoja: function (el) { T.lojaAberta = el.dataset.id; render(); },
    fecharModal: function (el, ev) {
      if (el.classList.contains('modal') && ev.target !== el) return;
      T.lojaAberta = null; render();
    },
    definirPrincipal: function (el) {
      const d = dados();
      d.principal = el.dataset.id;
      guardar();
      if (el.dataset.fechar) T.lojaAberta = null;
      mostrarToast(lojaPorId(d.principal).nome + ' é agora a tua loja principal.');
      render();
    },
    carrossel: function (el) {
      const faixa = el.closest('section').querySelector('.faixa');
      faixa.scrollBy({ left: Number(el.dataset.dir) * 280, behavior: 'smooth' });
    },

    /* Cozinha em Casa */
    alternarIng: function (el) {
      const id = el.dataset.id;
      if (T.casa.sel.has(id)) T.casa.sel.delete(id); else T.casa.sel.add(id);
      T.casa.resultados = null;
      render();
    },
    limparIng: function () { T.casa.sel = new Set(); T.casa.resultados = null; render(); },
    presetFrigorifico: function () {
      ['ovos', 'cebola', 'alho', 'batata', 'arroz', 'esparguete', 'tomate', 'atum_lata', 'cenoura', 'queijo_ralado']
        .forEach(function (id) { T.casa.sel.add(id); });
      T.casa.resultados = null;
      render();
    },
    pessoasCasa: function (el) { T.casa.pessoas = mudarPessoas(T.casa.pessoas, Number(el.dataset.d)); render(); },
    gerarCasa: function () {
      if (T.casa.sel.size < 2) return;
      T.casa.semente = 0;
      T.casa.resultados = null;
      ir('#casa-receitas');
    },
    outrasCasa: function () {
      T.casa.semente += 1;
      T.casa.resultados = L.sugerirPorIngredientes(T.casa.sel, { semente: T.casa.semente });
      render();
      window.scrollTo(0, 0);
    },

    /* Vou às Compras */
    opcao: function (el) {
      const passo = PASSOS[T.compras.passo];
      const op = passo.op[Number(el.dataset.k)];
      const resp = T.compras.resp;
      if (passo.multi) {
        const arr = resp[passo.id];
        const i = arr.indexOf(op.v);
        if (i >= 0) arr.splice(i, 1); else arr.push(op.v);
      } else {
        resp[passo.id] = op.v;
      }
      render();
    },
    anterior: function () { if (T.compras.passo > 0) { T.compras.passo -= 1; render(); } },
    seguinte: function () {
      if (T.compras.passo < PASSOS.length - 1) { T.compras.passo += 1; render(); window.scrollTo(0, 0); return; }
      T.compras.semente = 0;
      T.compras.resultados = null;
      ir('#compras-receitas');
    },
    outrasCompras: function () {
      T.compras.semente += 1;
      T.compras.resultados = L.sugerirPorPreferencias(T.compras.resp, { semente: T.compras.semente, indice: indicePreco() });
      render();
      window.scrollTo(0, 0);
    },
    refazer: function () { T.compras.passo = 0; T.compras.resultados = null; ir('#compras'); },
    adicionarTodas: function () {
      const res = T.compras.resultados;
      if (!res) return;
      let novas = 0;
      res.itens.forEach(function (i) {
        if (adicionarALista(i.receita.id, T.compras.resp.pessoas, [])) novas += 1;
      });
      guardar();
      mostrarToast(novas ? novas + ' ' + plural(novas, 'receita adicionada', 'receitas adicionadas') + ' à lista.' : 'Estas receitas já estavam na lista.');
      render();
    },

    /* Receita */
    pessoasReceita: function (el) { T.receita.pessoas = mudarPessoas(T.receita.pessoas, Number(el.dataset.d)); render(); },
    passo: function (el) {
      const i = Number(el.dataset.i);
      if (T.receita.feitos.has(i)) T.receita.feitos.delete(i); else T.receita.feitos.add(i);
      render();
    },
    favorito: function (el) {
      const d = dados();
      const id = el.dataset.id;
      const i = d.favoritos.indexOf(id);
      if (i >= 0) { d.favoritos.splice(i, 1); mostrarToast('Removida dos favoritos.'); }
      else { d.favoritos.push(id); mostrarToast('Guardada nos favoritos ♥'); }
      guardar(); render();
    },
    addLista: function (el) {
      const id = el.dataset.id;
      const deCasa = T.rotaAnterior === 'casa-receitas' && T.casa.sel.size > 0;
      const excluir = deCasa ? Array.from(T.casa.sel) : [];
      const nova = adicionarALista(id, T.receita.pessoas, excluir);
      guardar();
      mostrarToast(nova ? 'Adicionada à lista de compras.' : 'Lista atualizada.');
      render();
    },

    /* Lista de compras */
    pessoasLista: function (el) {
      const item = dados().lista.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (!item) return;
      item.pessoas = mudarPessoas(item.pessoas, Number(el.dataset.d));
      guardar(); render();
    },
    removerLista: function (el) {
      const d = dados();
      d.lista = d.lista.filter(function (x) { return x.id !== el.dataset.id; });
      guardar(); render();
    },
    limparLista: function () {
      if (!confirmar('esvaziar', 'Vais esvaziar a lista de compras.')) return;
      const d = dados();
      d.lista = []; d.marcados = {};
      guardar(); render();
    },
    marcar: function (el) {
      const d = dados();
      const id = el.dataset.id;
      if (d.marcados[id]) delete d.marcados[id]; else d.marcados[id] = true;
      guardar(); render();
    },
    desmarcarTudo: function () { dados().marcados = {}; guardar(); render(); },
    lojaLista: function (el) { dados().principal = el.dataset.id; guardar(); render(); },
    copiarLista: function () {
      const d = dados();
      const loja = lojaPrincipal();
      const texto = L.listaComoTexto(d.lista, loja.indice, loja.nome);
      const ok = function () { mostrarToast('Lista copiada para a área de transferência.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(ok, function () { copiarAlternativo(texto); ok(); });
      } else { copiarAlternativo(texto); ok(); }
    }
  };

  function copiarAlternativo(texto) {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignorar */ }
    document.body.removeChild(ta);
  }

  document.addEventListener('click', function (ev) {
    const el = ev.target.closest('[data-act]');
    if (!el || !acoes[el.dataset.act]) return;
    if (el.disabled) return;
    acoes[el.dataset.act](el, ev);
  });

  document.addEventListener('submit', function (ev) {
    const form = ev.target.closest('form[data-form]');
    if (!form) return;
    ev.preventDefault();
    if (form.dataset.form === 'auth') submeterAuth(form);
  });

  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.dataset && ev.target.dataset.input === 'busca') {
      T.casa.busca = ev.target.value;
      const g = document.getElementById('grade-ing');
      if (g) g.innerHTML = gradeIngredientes();
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && T.lojaAberta) { T.lojaAberta = null; render(); }
  });

  // Se uma fotografia não carregar, mostra-se o fundo colorido com o emoji do prato.
  document.addEventListener('error', function (ev) {
    const alvo = ev.target;
    if (alvo && alvo.tagName === 'IMG' && alvo.parentNode && alvo.parentNode.classList.contains('foto')) {
      alvo.parentNode.classList.add('sem-foto');
      alvo.remove();
    }
  }, true);

  window.addEventListener('hashchange', render);

  // Para testes automáticos (Node) e depuração.
  window.OQHPJ_APP = { vistas: vistas, estado: function () { return S; }, T: T, render: render, acoes: acoes, PASSOS: PASSOS };

  render();
})();

</script>
</body>
</html>
